name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    # Daily rebuild so the home page news feeds stay fresh
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: bun
        uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Check source and Astro templates
        run: bun run check
      - name: Run tests
        run: bun run test
      - uses: withastro/action@v3
        with:
          package-manager: bun@${{ steps.bun.outputs.bun-version }}
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
